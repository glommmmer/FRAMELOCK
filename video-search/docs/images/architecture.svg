<path d="M820 392 V423" fill="none" stroke="#34362f" stroke-width="2"/>
<path d="M820 517 V548" fill="none" stroke="#34362f" stroke-width="2"/>
<path d="M280 660 V698" fill="none" stroke="#34362f" stroke-width="2"/>
<path d="M500 746 H550 V346 H598" fill="none" stroke="#34362f" stroke-width="2"/>
<text x="508" y="683" font-size="13" fill="#55594b" font-weight="400">已发布</text>
<path d="M1040 471 H1057 V746 H1042" fill="none" stroke="#34362f" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M1040 766 H1080 V346 H1042" fill="none" stroke="#34362f" stroke-width="2" stroke-dasharray="7 5"/>
<text x="855" y="687" font-size="15" fill="#55594b" font-weight="400">证据不足且未达限制</text>
<rect x="60" y="830" width="980" height="128" fill="#171914"/>
<text x="82" y="862" font-size="20" fill="#dbff58" font-weight="700">存储与执行边界</text>
<text x="82" y="892" font-size="17" fill="#f4f4ef" font-weight="400">MinIO：新上传原视频与分片；私有 OSS：历史对象与 ASR 派生音频中转。</text>
<text x="82" y="919" font-size="17" fill="#f4f4ef" font-weight="400">本机完整模式：API 与 Worker 同进程；轻量模式：数据库调度 + 本地向量。</text>
<text x="82" y="946" font-size="17" fill="#f4f4ef" font-weight="400">Agent：最多 8 次工具调用 / 120 秒 / 2 轮补查；达到上限会说明未检查完。</text>
